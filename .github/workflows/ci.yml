name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14 # 使用 macOS Sonoma 运行器

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        # xcode-select：指定较新的 Xcode 环境（自带 Swift 6 兼容工具链），保证与本地 platforms: [.macOS(.v14)] 配置一致。

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --enable-code-coverage

      - name: Run tests
        run: swift test