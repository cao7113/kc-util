name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Universal Binary & Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build arm64 & x86_64
        run: |
          swift build -c release --triple arm64-apple-macosx15.0
          swift build -c release --triple x86_64-apple-macosx15.0

      - name: Create Universal Binary
        run: |
          mkdir -p dist/bin
          
          # 动态查找 arm64 和 x86_64 架构下生成的二进制路径，避免 SPM 路径格式差异
          ARM64_BIN=$(find .build -type f -path "*/release/kc-util" | grep -i "arm64" | head -n 1)
          X86_BIN=$(find .build -type f -path "*/release/kc-util" | grep -i "x86_64" | head -n 1)

          echo "Found ARM64 Binary: $ARM64_BIN"
          echo "Found X86_64 Binary: $X86_BIN"

          # 使用 lipo 合并为通用二进制
          lipo -create "$ARM64_BIN" "$X86_BIN" -output dist/bin/kc-util
          
          # 验证二进制信息
          file dist/bin/kc-util

      - name: Package Release Asset
        run: |
          VERSION=${GITHUB_REF_NAME}
          cd dist/bin
          tar -czf "../kc-util-${VERSION}-apple-darwin.tar.gz" kc-util
          cd ..
          shasum -a 256 "kc-util-${VERSION}-apple-darwin.tar.gz" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kc-util-*.tar.gz
            dist/checksums.txt
          generate_release_notes: true